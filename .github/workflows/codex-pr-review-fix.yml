name: Codex PR Review Fix Trigger

on:
  workflow_run:
    workflows: ["Claude PR Review"]
    types: [completed]

jobs:
  request-codex-fix:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Request Codex Cloud fix for new Claude findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          MAX_CODEX_FIX_ROUNDS: "3"
        shell: bash
        run: |
          set -euo pipefail

          pr_number=""
          target_head_sha=""
          finding_count="0"
          trigger_comment_url=""

          write_summary() {
            local stop_reason="$1"
            local codex_trigger_posted="$2"
            {
              echo "## Codex PR Review Fix Trigger"
              echo "- upstream_run_id: $RUN_ID"
              echo "- upstream_run_attempt: $RUN_ATTEMPT"
              echo "- upstream_head_branch: ${RUN_HEAD_BRANCH:-unavailable}"
              echo "- upstream_head_sha: ${RUN_HEAD_SHA:-unavailable}"
              echo "- resolved_pr: ${pr_number:-unresolved}"
              echo "- target_head_sha: ${target_head_sha:-unresolved}"
              echo "- finding_count: ${finding_count:-0}"
              echo "- stop_reason: $stop_reason"
              echo "- codex_trigger_posted: $codex_trigger_posted"
              if [[ -n "$trigger_comment_url" ]]; then
                echo "- trigger_comment_url: $trigger_comment_url"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          on_error() {
            local rc=$?
            trap - ERR
            write_summary "execution_failed(exit=$rc)" "false"
            exit "$rc"
          }
          trap on_error ERR

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"

          if [[ -z "$pr_number" && -n "$RUN_HEAD_BRANCH" ]]; then
            repo_owner="${REPO%%/*}"
            branch_prs="$(gh api "repos/$REPO/pulls?state=open&head=$repo_owner:$RUN_HEAD_BRANCH&per_page=100")"
            if [[ "$(jq 'length' <<<"$branch_prs")" -eq 1 ]]; then
              pr_number="$(jq -r '.[0].number' <<<"$branch_prs")"
              echo "Resolved PR #$pr_number from workflow_run.head_branch=$RUN_HEAD_BRANCH."
            fi
          fi

          if [[ -z "$pr_number" && -n "$RUN_HEAD_SHA" ]]; then
            commit_prs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$RUN_HEAD_SHA/pulls")"
            open_commit_prs="$(jq '[.[] | select(.state == "open")]' <<<"$commit_prs")"
            if [[ "$(jq 'length' <<<"$open_commit_prs")" -eq 1 ]]; then
              pr_number="$(jq -r '.[0].number' <<<"$open_commit_prs")"
              echo "Resolved PR #$pr_number from workflow_run.head_sha=$RUN_HEAD_SHA."
            fi
          fi

          if [[ -z "$pr_number" ]]; then
            echo "Unable to resolve a unique open PR for Claude review run $RUN_ID; nothing to do."
            write_summary "pr_unresolved" "false"
            exit 0
          fi

          pr_json="$(gh api "repos/$REPO/pulls/$pr_number")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          target_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          if [[ "$head_repo" != "$REPO" ]]; then
            echo "Fork pull requests are outside this automation boundary."
            write_summary "fork_pr_outside_boundary" "false"
            exit 0
          fi

          issue_comments="$(gh api --paginate "repos/$REPO/issues/$pr_number/comments?per_page=100" --slurp)"
          prior_rounds="$(jq '[.[][] | select(.body | contains("<!-- codex-fix-trigger:"))] | length' <<<"$issue_comments")"
          if (( prior_rounds >= MAX_CODEX_FIX_ROUNDS )); then
            echo "Automatic Codex fix round limit reached: $prior_rounds/$MAX_CODEX_FIX_ROUNDS."
            write_summary "round_limit_reached($prior_rounds/$MAX_CODEX_FIX_ROUNDS)" "false"
            exit 0
          fi

          review_comments="$(gh api --paginate "repos/$REPO/pulls/$pr_number/comments?per_page=100" --slurp)"
          new_findings="$(
            jq \
              --arg head_sha "$target_head_sha" \
              --arg started_at "$RUN_STARTED_AT" \
              '[.[][]
                | select(.user.login == "claude[bot]")
                | select(.in_reply_to_id == null)
                | select(.commit_id == $head_sha)
                | select(.created_at >= $started_at)
              ]' \
              <<<"$review_comments"
          )"

          finding_count="$(jq 'length' <<<"$new_findings")"
          if [[ "$finding_count" -eq 0 ]]; then
            echo "Claude review completed without new inline findings for current PR head $target_head_sha."
            write_summary "no_matching_findings" "false"
            exit 0
          fi

          unprocessed='[]'
          while IFS= read -r finding; do
            comment_id="$(jq -r '.id' <<<"$finding")"
            marker="codex-review-comment:$comment_id"
            if jq -e --arg marker "$marker" 'any(.[][]; .body | contains($marker))' <<<"$issue_comments" >/dev/null; then
              echo "Review comment $comment_id was already handed to Codex; skip."
              continue
            fi
            unprocessed="$(jq --argjson finding "$finding" '. + [$finding]' <<<"$unprocessed")"
          done < <(jq -c '.[]' <<<"$new_findings")

          finding_count="$(jq 'length' <<<"$unprocessed")"
          if [[ "$finding_count" -eq 0 ]]; then
            echo "All Claude findings from this review were already processed."
            write_summary "all_findings_already_processed" "false"
            exit 0
          fi

          findings_text="$(
            jq -r '.[] | "- [" + (.path // "path不明") + "](" + .html_url + ") <!-- codex-review-comment:" + (.id | tostring) + " -->"' \
              <<<"$unprocessed"
          )"

          body=$(cat <<EOF
          @codex address the Claude review feedback listed below.

          Claude PR Reviewで新たに確認されたinline指摘を対象にする。
          現在のPR headで各指摘がまだ妥当かを再確認し、妥当な指摘だけを最小限の変更で修正すること。必要なvalidationを実行すること。既に解消済み、誤り、曖昧、または設計判断が必要な指摘は推測で変更しないこと。

          ${findings_text}

          <!-- codex-fix-trigger:run:${RUN_ID}:attempt:${RUN_ATTEMPT} -->
          EOF
          )

          trigger_comment_url="$(gh pr comment "$pr_number" --repo "$REPO" --body "$body")"
          echo "Codex fix trigger posted: $trigger_comment_url"
          write_summary "trigger_posted" "true"
