name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このリポジトリのPRをレビューし、日本語でコメントする。
            root `CLAUDE.md` と、変更pathに局所`AGENTS.md`がある場合はその領域固有規則も正本として適用する。

            レビュー観点は次の4点に限定する。

            1. repository規律への適合
               - 一つの変更で一つの判断または一つのartifact単位だけを扱っているか。
               - 依頼が要求しないartifactを変更していないか。
               - 正本と履歴を区別しているか。履歴artifactを現在解釈へin-placeで書き換えていないか。
               - prompt変更と評価条件変更を同じ比較単位へ混ぜていないか。
               - root `README.md`が入口と要約に限定されているか（配下READMEの詳細一覧は対象外）。
               - repository外のexecutor、CLI、tool adapter、runtime hook、外部wrapper、target runtimeの変更を解決策や次案として持ち込んでいないか。

            2. 評価artifactの整合
               - case追加やresult登録が、対象領域のschema、登録条件、fixture identityの規則を満たしているか。
               - artifactの存在を、評価済み・採用済み・release済み・本体反映済みと混同していないか。
               - baseline、candidate、release、evaluation result、approval、projectionを別の状態として扱っているか。

            3. secret・非公開logの混入
               - secret、credential、非公開のraw run log、一時worktreeがcommitに含まれていないか。

            4. 文書品質
               - 原則として日本語で記述されているか（schema名、path、status、commandの英語表記は許容）。
               - 正本用語が一貫しているか。文書内のpath参照やリンクが実在するか。

            実行手順。
            - `gh pr diff` と `gh pr view` で差分と説明を実測する。
            - 差分が触れているpathの局所`AGENTS.md`を読み、その規則で判断する。
            - 具体的な違反箇所は `mcp__github_inline_comment__create_inline_comment` でinlineに指摘する（`confirmed: true`）。
            - 最後に `gh pr comment` で総括を1件投稿する。観点ごとに「指摘なし」も明示する。

            制約。
            - 差分から確定できない事実を推測で補完しない。確認できない点は「未確認」として述べる。
            - このworkflowではファイルを変更せず、push、commit、merge、labelの操作も行わない。指摘のみを出力する。
            - 規則違反ではない好みの相違を指摘として並べない。
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
